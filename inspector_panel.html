<div data-properties-surface="inspector" class="cw-block-inspector cw-camera-photo-inspector" data-block-inspector-root data-node-id="{{ node_id }}" data-node-type="{{ node_type }}">
  <div class="inspector-selection {{ summary_hidden }}" data-node-type="{{ node_type }}">
    <div class="inspector-node-card">
      <div class="inspector-node-icon">{{ node_icon }}</div>
      <div class="inspector-node-copy">
        <strong>{{ node_title }}</strong>
        <span>{{ node_kind }}</span>
      </div>
      <span class="inspector-node-tag">{{ node_tag }}</span>
    </div>
    <div class="inspector-tabs">
      <button class="inspector-tab {{ general_active }}" data-inspector-tab="general" type="button" data-i18n="ui.block_kit.general">General</button>
      <button class="inspector-tab {{ ports_active }} {{ ports_tab_hidden }}" data-inspector-tab="ports" type="button" {{ ports_tab_disabled }} data-i18n="ui.block_kit.ports">Ports</button>
    </div>
  </div>

  <div class="inspector-view {{ general_hidden }}" data-inspector-panel-tab="general">
    <div class="field-group {{ title_hidden }}">
      <label data-i18n="ui.block_kit.node_name">Node name</label>
      <input data-node-title-input type="text" placeholder="{{ node_title_placeholder }}" value="{{ node_title }}" />
    </div>
    <div class="inspector-actions {{ actions_hidden }}">
      <button class="ghost-btn {{ duplicate_hidden }}" data-block-action="duplicate" type="button" data-i18n="ui.block_kit.duplicate">Duplicate</button>
      <button class="danger-btn {{ delete_hidden }}" data-block-action="delete" type="button" data-i18n="ui.block_kit.delete_block">Delete the block</button>
    </div>
    <p class="inspector-copy" data-i18n="block.camera_photo.inspector_hint">
      Takes a photo with the browser camera, from the block card or from the modal.
    </p>
    <div class="field-grid">
      <div class="field-group">
        <label data-i18n="block.camera_photo.resolution_label">Resolution</label>
        <input data-block-config-field="resolution" type="text" value="{{ resolution }}" placeholder="1280x720" spellcheck="false" />
      </div>
      <div class="field-group">
        <label data-i18n="block.camera_photo.camera_label">Camera</label>
        <select data-block-config-field="camera_facing">
          <option value="environment" {{ camera_facing_environment_selected }} data-i18n="block.camera_photo.camera_back">Back</option>
          <option value="user" {{ camera_facing_user_selected }} data-i18n="block.camera_photo.camera_front">Front</option>
        </select>
      </div>
      <div class="field-group">
        <label data-i18n="block.camera_photo.jpeg_quality_label">JPEG quality</label>
        <input data-block-config-field="jpeg_quality" data-block-value-type="number" type="number" min="0.1" max="1" step="0.01" value="{{ jpeg_quality }}" />
      </div>
    </div>
    <div class="field-group">
      <label data-i18n="block.camera_photo.output_folder_label">Output folder</label>
      <input data-block-config-field="output_dir" type="text" value="{{ output_dir }}" placeholder="exports/camera" spellcheck="false" />
    </div>
    <div class="field-group {{ latest_capture_hidden }}">
      <label data-i18n="block.camera_photo.latest_capture_label">Latest capture</label>
      <input readonly type="text" value="{{ latest_capture_value }}" spellcheck="false" />
    </div>
    <div class="inspector-actions">
      <button class="solid-btn" data-block-apply type="button" disabled data-i18n="ui.block_kit.apply">Apply</button>
    </div>
  </div>

  <div class="inspector-view {{ ports_hidden }}" data-inspector-panel-tab="ports">
    <div class="ports-editor-section">
      <div class="ports-editor-header">
        <span class="group-label" data-i18n="ui.block_kit.inputs">Inputs</span>
        <span class="ports-editor-actions">
          <button class="ghost-btn add-port-btn {{ add_mcp_input_hidden }}" data-add-mcp-input-port type="button" {{ add_mcp_input_disabled }}>+ MCP</button>
          <button class="ghost-btn add-port-btn {{ add_input_hidden }}" data-add-input-port type="button" {{ add_input_disabled }} data-i18n="ui.block_kit.add_input">+ Add an input</button>
        </span>
      </div>
      <div class="ports-editor-list">{{ inputs_html }}</div>
    </div>
    <div class="ports-editor-section">
      <div class="ports-editor-header">
        <span class="group-label" data-i18n="ui.block_kit.outputs">Outputs</span>
        <button class="ghost-btn add-port-btn {{ add_output_hidden }}" data-add-output-port type="button" {{ add_output_disabled }} data-i18n="ui.block_kit.add_output">+ Add an output</button>
      </div>
      <div class="ports-editor-list">{{ outputs_html }}</div>
    </div>
    <div class="inspector-copy" data-i18n="ui.block_kit.port_names_hint">
      Names are normalized automatically: lowercase, spaces replaced by _.</div>
  </div>
</div>
